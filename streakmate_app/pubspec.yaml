name: streakmate_app
description: StreakMate — Habit & Streak Tracking App
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3+1
  share_plus: ^10.0.0
  fl_chart: ^0.69.0
  timeago: ^3.7.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.1

  # ── State management ──────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Routing ────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Networking ─────────────────────────────────────────────────────────
  dio: ^5.5.0

  # ── Secure token storage ───────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── (Optional) env loading — uncomment if you wire flutter_dotenv ───────
  # flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.8
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/