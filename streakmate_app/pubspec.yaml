name: streakmate_app
description: StreakMate — Habit & Streak Tracking App
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3+1
  share_plus: ^10.0.0
  fl_chart: ^0.69.0
  timeago: ^3.7.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.1

  # ── State management ──────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Routing ────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Networking ─────────────────────────────────────────────────────────
  dio: ^5.5.0

  # ── Secure token storage ───────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── (Optional) env loading — uncomment if you wire flutter_dotenv ───────
  # flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/images/bg1.png
    - assets/images/bg2.png
    - assets/images/bg3.png
    - assets/images/bg4.png
    - assets/images/island1.png
    - assets/images/island2.png
    - assets/images/island3.png
    - assets/images/island4.png
    - assets/images/island5.png
    - assets/images/homeScreen.png
    - assets/images/homestar.png
    - assets/images/defaultAvatar.png